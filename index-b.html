  const header = () => `
    <div class="header">
      <button class="icon-btn" data-back aria-label="Back">${ICON.back}</button>
      ${logo}
      <span class="icon-btn" aria-hidden="true"></span>
    </div>`;

  const progress = (n) => `
    <div class="progress">
      <div class="progress__count">${n}/<span>${TOTAL}</span></div>
      <div class="progress__bars">${Array.from({ length: TOTAL }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>
    </div>`;

  const nextBtn = (label = 'Next step') => `<button class="btn" data-next disabled>${label}</button>`;

  /* ---------- questions ---------- */
  const Q = [
    {
      id: 'goal', multi: true,
      title: 'What do you want to achieve right now?',
      render: (q) => `<div class="list">${[
        ['goal-stronger', 'Get stronger'],
        ['goal-flexible', 'Become more flexible'],
        ['goal-move', 'Move more easily and freely'],
        ['goal-shape', 'Get in shape'],
        ['goal-splits', 'Reach my splits'],
        ['goal-better', 'Simply feel better'],
      ].map(([img, t]) => `
        <div class="opt opt--row" data-opt="${t}" role="checkbox" tabindex="0">
          <div class="opt-main"><img src="${ICONS}${img}.svg" alt=""><span class="opt-label">${t}</span></div>
          ${chk()}
        </div>`).join('')}</div>`,
    },
    {
      id: 'body',
      title: 'How does your body feel right now?',
      render: () => `<div class="list">${[
        ['q2-1', 'I feel great'],
        ['q2-2', 'I feel a little stiff'],
        ['q2-3', 'I feel very stiff'],
        ['q2-4', 'I often feel tension'],
        ['q2-5', 'I feel like I lack strength and energy', true],
      ].map(([img, t, lh]) => `
        <div class="opt opt--photo" data-opt="${t}" role="radio" tabindex="0">
          <div class="opt-main"><img src="${IMG}${img}.webp" alt=""><span class="opt-label${lh ? ' opt-label--lh' : ''}">${t}</span></div>
          ${chk(true)}
        </div>`).join('')}</div>`,
    },
    {
      id: 'zones', multi: true, max: 2,
      title: 'What do you want to improve first?',
      subtitle: 'Choose 1–2:',
      // zone cards live outside the top block (body map)
      after: () => {
        const zone = (t, img, w, h, it, tt, lh) => `
          <div class="opt opt--zone" data-opt="${t.replace('<br>', ' ')}" role="checkbox" tabindex="0">
            <img class="zone-icon" src="${ICONS}${img}.svg" alt="" style="width:calc(${w} * var(--u));height:calc(${h} * var(--u));top:calc(${it} * var(--u))">
            <span class="opt-label${lh ? ' opt-label--lh' : ''}" style="top:calc(${tt} * var(--u))">${t}</span>
          </div>`;
        return `
        <div class="bodymap">
          <img class="bodymap__img" src="${IMG}body-light.webp" alt="">
          <div class="bodymap__col bodymap__col--l">
            ${zone('Hips', 'zone-hips', 36.52, 39.65, 32.2, 79.75)}
            ${zone('Shoulders<br>and neck', 'zone-shoulders', 38.12, 45.57, 22.24, 75.76, true)}
            ${zone('Core', 'zone-core', 37.06, 39.13, 32.39, 79.5)}
          </div>
          <div class="bodymap__col bodymap__col--r">
            ${zone('Back and<br>lower back', 'zone-back', 39.52, 45.6, 22.16, 75.75, true)}
            ${zone('Legs', 'zone-legs', 20.49, 52.24, 25.95, 85.98)}
            ${zone('Full body', 'zone-full', 24.04, 66.6, 18.78, 93.22)}
          </div>
        </div>`;
      },
    },
    {
      id: 'time',
      title: 'How much time can you realistically spend on one workout?',
      render: () => `<div class="grid">${[
        ['time-clock', '10–15', 'minutes'],
        ['time-clock', '20–30', 'minutes'],
        ['time-clock', '30–45', 'minutes'],
        ['time-varies', 'My schedule', 'varies each day', true],
      ].map(([img, big, sub, mid]) => `
        <div class="opt opt--tile" data-opt="${big}" role="radio" tabindex="0">
          <img class="tile-icon" src="${ICONS}${img}.svg" alt="">
          <div class="${mid ? 'tile-mid' : 'tile-big'}">${big}</div>
          <div class="tile-sub${mid ? ' tile-sub--wide' : ''}">${sub}</div>
        </div>`).join('')}</div>`,
    },
    {
      id: 'days',
      title: 'How many days a week are you realistically ready to work out?',
      render: () => `
        <div class="days" data-days>${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `
          <div class="day" data-day="${d}" role="checkbox" tabindex="0"><div class="day__name">${d}</div><div class="day__dot"></div></div>`).join('')}
        </div>
        <div class="grid">${[
          ['2–3', 'days'], ['4-5', 'days'], ['6-7', 'days'], ['I’m not sure,', 'I want to start gradually', true],
        ].map(([big, sub, mid]) => `
          <div class="opt opt--tile h155" data-opt="${big}" role="radio" tabindex="0">
            <div class="${mid ? 'tile-mid' : 'tile-big'}">${big}</div>
            <div class="tile-sub${mid ? ' tile-sub--wide' : ''}">${sub}</div>
          </div>`).join('')}</div>`,
    },
    {
      id: 'place',
      title: 'Where do you prefer to work out?',
      render: () => `<div class="grid">${[
        ['Rectangle 1', 'At home with no equipment'],
        ['Rectangle 1 1', 'At home with a mat / basic equipment'],
        ['Rectangle 1 2', 'At the Gym'],
        ['Rectangle 1 3', 'Anywhere'],
      ].map(([img, t]) => imgCard(img, t, 'tall')).join('')}</div>`,
    },
    {
      id: 'types',
      title: 'Which types of workouts do you enjoy the most?',
      render: () => `<div class="grid">
        ${imgCard('Rectangle 1 4', 'Stretching', '', true)}
        ${imgCard('q7-pilates', 'Core training')}
        ${imgCard('q7-strength', 'Strength training')}
        ${imgCard('q7-yoga', 'Basic mobility')}
        ${imgCard('q7-cardio', 'Mastering splits')}
        <div class="opt opt--img opt--mix" data-opt="I want to mix it up" role="radio" tabindex="0">
          <div class="mix-img"><img src="${IMG}Rectangle 2.webp" alt=""></div>
          <div class="card-text"><span class="opt-label">I want to mix it up</span></div>
        </div>
      </div>`,
    },
    {
      id: 'obstacles', button: 'Get my plan!',
      title: 'What most often gets in the way of working out regularly?',
      render: () => `<div class="grid">
        ${imgCard('Rectangle 1 9', 'I don’t know what to do', '', true)}
        ${imgCard('Rectangle 1 10', 'I don’t have enough time')}
        ${imgCard('Rectangle 1 11', 'I get bored <br>quickly')}
        ${imgCard('Rectangle 1 12', 'Workouts feel too hard')}
        ${imgCard('Rectangle 1 13', 'I lose <br>motivation')}
        ${imgCard('Rectangle 1 14', 'It’s hard to get started again after a break')}
      </div>`,
    },
  ];

  function imgCard(img, t, cls = '', p8 = false) {
    return `
      <div class="opt opt--img ${cls}" data-opt="${t.replace(/<br>/g, '').replace('&amp;', '&')}" role="radio" tabindex="0">
        <img class="card-img" src="${IMG}${img}.webp" alt="">
        <div class="card-text${p8 ? ' p8' : ''}"><span class="opt-label">${t}</span></div>
      </div>`;
  }

  /* ---------- screens ---------- */
  const startScreen = `
    <section class="screen screen--start" data-screen="0">
      <div class="start-head">
        <h1 class="start-title"><span class="l1">FIND YOUR</span><span class="l2">perfect</span><span class="l3">workout plan</span></h1>
        <p class="start-sub">Answer a few questions and get your personalized week</p>
      </div>
      <div class="start-foot">
        <button class="btn btn--lg" data-start>Take the Quiz ${ICON.arrow}</button>
        <div class="start-note"><img src="${IMG}Vector 12.webp" alt="">Takes less than 2 minutes</div>
      </div>
    </section>`;

  const qScreen = (q, i) => `
    <section class="screen" data-screen="${i + 1}" data-q="${q.id}">
      <div class="top">
        ${header()}
        ${progress(i + 1)}
        ${q.subtitle
          ? `<div class="title-wrap"><h2 class="title">${q.title}</h2><p class="subtitle">${q.subtitle}</p></div>`
          : `<h2 class="title">${q.title}</h2>`}
        ${q.render ? q.render(q) : ''}
      </div>
      ${q.after ? q.after(q) : ''}
      ${nextBtn(q.button)}
    </section>`;

  /* ---------- result: plan routing (Quiz PlanRouting.xlsx) ----------
     Q4 time, Q5 days, Q6 place and Q8 obstacles don't affect the plan. */
  const PLANS = {
    flex: {
      name: 'Flex & Split',
      week: [
        ['Hip Mobility', 'Deep Hip Opening & Glute Activation', 15],
        ['Front Split', 'Front Split Foundations: Hip Flexor & Hamstring Lengthening', 20],
        ['Only Flexibility', 'Full-Body Flow: Spine, Hips & Hamstrings', 15],
        ['Mobility Mastery', 'Controlled Range: Active Hip & Pelvis Work', 20],
        ['Middle Split', 'Middle Split Progression: Inner Thigh & Adductor Opening', 20],
        ['Only Flexibility', 'Active Flexibility: Hamstrings & Lower Back', 15],
      ],
    },
    strong: {
      name: 'Strong & Shaped',
      week: [
        ['Fit Program', 'Full-Body Strength: Glutes, Core & Legs', 20],
        ['Back Mobility', 'Back Strength & Spinal Control', 15],
        ['Mobility Mastery', 'Active Mobility: Hips & Shoulders', 20],
        ['Fit Program', 'Lower-Body Power: Glutes & Hamstrings', 20],
        ['Hip Mobility', 'Hip Stability & Deep Glute Activation', 15],
        ['Upper Body Mobility', 'Shoulder & Upper-Back Strength', 15],
      ],
    },
    release: {
      name: 'Release & Reset',
      week: [
        ['Beginner Mobility', 'Wake-Up Flow: Hips, Glutes & Lower Back', 15],
        ['Upper Body Mobility', 'Neck & Shoulder Tension Release', 15],
        ['Back Mobility', 'Lower-Back & Spine Decompression', 15],
        ['Beginner Mobility', 'Gentle Full-Body Activation', 15],
        ['Mobility Mastery', 'Thoracic Rotation & Spinal Articulation', 20],
        ['Upper Body Mobility', 'Chest Opening & Posture Reset', 15],
      ],
    },
    full: {
      name: 'Full Body Flow',
      week: [
        ['Beginner Mobility', 'Foundations: Full-Body Activation', 15],
        ['Mobility Mastery', 'Range & Control: Hips & Spine', 20],
        ['Upper Body Mobility', 'Shoulders, Neck & Thoracic Release', 15],
        ['Hip Mobility', 'Hip Opening & Rotation', 15],
        ['Full Split', 'Split Progression: Legs & Hamstrings', 20],
        ['Back Mobility', 'Spine Mobility & Backbend Prep', 15],
      ],
    },
  };

  // which plan each answer points to (answers not listed are neutral)
  const VOTES = {
    goal: {
      'Become more flexible': 'flex', 'Reach my splits': 'flex',
      'Get stronger': 'strong', 'Get in shape': 'strong',
      'Move more easily and freely': 'release', 'Simply feel better': 'release',
    },
    body: {
      'I feel a little stiff': 'flex',
      'I feel very stiff': 'release', 'I often feel tension': 'release', 'I feel like I lack strength and energy': 'release',
      'I feel great': 'full',
    },
    zones: { 'Legs': 'strong', 'Core': 'strong', 'Full body': 'full' },
    types: {
      'Stretching': 'flex', 'Mastering splits': 'flex',
      'Strength training': 'strong', 'Core training': 'strong',
      'Basic mobility': 'release',
      'I want to mix it up': 'full',
    },
  };
  const PRIORITY = ['types', 'goal', 'body', 'zones'];

  function pickPlan(a) {
    const has = (q, v) => (a[q] || []).includes(v);
    // hard rules: "mix it up" or "full body" → Full Body Flow
    if (has('types', 'I want to mix it up') || has('zones', 'Full body')) return 'full';

    const score = { flex: 0, strong: 0, release: 0, full: 0 };
    Object.keys(VOTES).forEach((q) => (a[q] || []).forEach((v) => { if (VOTES[q][v]) score[VOTES[q][v]]++; }));
    const best = Math.max(...Object.values(score));
    let tied = Object.keys(score).filter((k) => score[k] === best);
    // tie → the plan of the most specific answer (workout type, then goal, feel, area)
    for (const q of PRIORITY) {
      if (tied.length < 2) break;
      const pref = (a[q] || []).map((v) => VOTES[q][v]).find((k) => tied.includes(k));
      if (pref) tied = [pref];
    }
    const plan = best ? tied[0] : 'full';
    // Flex & Split for a very stiff body → Full Body Flow
    return plan === 'flex' && has('body', 'I feel very stiff') ? 'full' : plan;
  }

  // the week follows the days picked in Q5: workouts go to those days in order, the rest are Rest days
  const WEEK = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const DEFAULT_DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  function planRows(key, picked) {
    const train = picked && picked.length ? picked : DEFAULT_DAYS;
    let n = 0;
    return WEEK.map((d, i) => {
      const last = i === WEEK.length - 1;
      const cls = `plan-row${last ? ' plan-row--last' : i === WEEK.length - 2 ? ' plan-row--pre-last' : ''}`;
      const axis = `<div class="plan-row__axis"><div class="plan-row__day">${d}</div>${last ? '' : '<i class="plan-row__line"></i>'}</div>`;
      if (!train.includes(d)) {
        return `
      <div class="${cls} plan-row--rest">${axis}<div class="plan-row__body"><div class="plan-row__lesson">Rest</div></div></div>`;
      }
      const [name, lesson, min] = PLANS[key].week[n++ % PLANS[key].week.length];
      return `
      <div class="${cls}">${axis}
        <div class="plan-row__body">
          <div class="plan-row__head"><span class="plan-row__name">${name}</span><span class="plan-row__time">${min} min</span></div>
          <div class="plan-row__lesson">${lesson}</div>
        </div>
      </div>`;
    }).join('');
  }

  const fmtPrice = (n) => `${n.toFixed(OFFER.decimals)}€`;

  const resultScreen = `
    <section class="screen screen--result" data-screen="${Q.length + 1}">
      <div class="result-top">
        ${logo}
        <div class="week">
          <div class="week-title">
            <div class="week-title__bar"></div>
            <h2 class="week-title__txt">WE BUILT YOUR <span>FIRST WEEK</span></h2>
          </div>
          <div class="week-body">
            <div class="plan" data-plan>${planRows('flex')}</div>
            <p class="note"><span>*</span>Based on your goals, time and fitness level</p>
          </div>
        </div>
        <div class="offer">
          <div class="offer__box${OFFER.badge ? ' offer__box--sale' : ''}">
            <div class="offer__title">YOUR PLAN<br>IS READY:</div>
            ${OFFER.badge
              ? `<div class="offer__side"><div class="offer__price">${fmtPrice(OFFER.price)}</div><div class="offer__badge">${OFFER.badge}</div></div>`
              : `<div class="offer__price">${fmtPrice(OFFER.price)}</div>`}
          </div>
          <a class="btn btn--cta" href="${OFFER.url}" data-pay="${OFFER.pay}" data-finish>${OFFER.cta} ${ICON.arrow}</a>
          <div class="feats">
            <div class="feat"><img src="${ICONS}feat-programs.svg" alt=""><div><b>16+<br>programs</b></div></div>
            <i class="feats__div"></i>
            <div class="feat"><img src="${ICONS}feat-week.svg" alt=""><div><b>Your personalized<br></b><span>week</span></div></div>
            <i class="feats__div"></i>
            <div class="feat"><img src="${ICONS}feat-place.svg" alt=""><div><b>Train at<br></b><span>home or gym</span></div></div>
            <i class="feats__div"></i>
            <div class="feat"><img src="${ICONS}feat-time.svg" alt=""><div><b>10–45 min<br></b><span>sessions</span></div></div>
          </div>
        </div>
      </div>
    </section>`;

  const app = document.getElementById('app');
  app.innerHTML = startScreen + Q.map(qScreen).join('') + resultScreen;

  /* ---------- state & navigation ---------- */
  const screens = [...app.querySelectorAll('.screen')];
  const answers = {};
  let current = 0;

  function go(to) {
    const back = to < current;
    screens[current].classList.remove('is-active', 'is-back');
    current = to;
    const s = screens[current];
    s.classList.toggle('is-back', back);
    s.classList.add('is-active');
    window.scrollTo(0, 0);
    const qid = s.dataset.q;
    let stepName = to === 0 ? 'Лендинг' : qid ? `${to}. ${NAMES[qid]}` : '';
    if (s.classList.contains('screen--result')) {
      // ?plan=flex|strong|release|full forces a plan (handy for QA)
      const forced = new URLSearchParams(location.search).get('plan');
      const plan = PLANS[forced] ? forced : pickPlan(answers);
      s.querySelector('[data-plan]').innerHTML = planRows(plan, answers.weekdays);
      countPrice(s.querySelector('.offer__price'));
      Track.answer('plan', [PLANS[plan].name]);
      stepName = `Результат: ${PLANS[plan].name} + оффер ${fmtPrice(OFFER.price)}`;
    }
    Track.step(to, stepName, qid);
  }

  // price counter on the result screen (OFFER.from → OFFER.price)
  let priceRaf = 0;
  function countPrice(el, from = OFFER.from, to = OFFER.price, dur = 1800) {
    cancelAnimationFrame(priceRaf);
    const t0 = performance.now();
    const step = Math.pow(10, -OFFER.decimals);
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const ease = 1 - Math.pow(1 - k, 3);
      el.textContent = fmtPrice(Math.round((from + (to - from) * ease) / step) * step);
      if (k < 1) priceRaf = requestAnimationFrame(tick);
    };
    el.textContent = fmtPrice(from);
    priceRaf = requestAnimationFrame(tick);
  }

  let dayTimers = [];
  function setDays(list) {
    dayTimers.forEach(clearTimeout);
    const days = [...app.querySelectorAll('[data-day]')];
    days.forEach((d) => d.classList.remove('is-selected'));
    days.filter((d) => list.includes(d.dataset.day)).forEach((d, i) => {
      dayTimers.push(setTimeout(() => d.classList.add('is-selected'), i * 80));
    });
    answers.weekdays = days.filter((d) => list.includes(d.dataset.day)).map((d) => d.dataset.day);
    Track.answer('weekdays', answers.weekdays);
  }

  function updateNext(screen) {
    const id = screen.dataset.q;
    const btn = screen.querySelector('[data-next]');
    if (btn) btn.disabled = !(answers[id] && answers[id].length);
  }

  function toggle(el) {
    const screen = el.closest('.screen');
    const q = Q.find((x) => x.id === screen.dataset.q);
    const opts = [...screen.querySelectorAll('[data-opt]')];
    const on = el.classList.contains('is-selected');

    if (q.multi) {
      if (!on && q.max && opts.filter((o) => o.classList.contains('is-selected')).length >= q.max) {
        // replace the oldest pick when the limit is reached
        const first = screen.querySelector('[data-opt].is-selected');
        first && first.classList.remove('is-selected');
      }
      el.classList.toggle('is-selected', !on);
    } else {
      opts.forEach((o) => o.classList.toggle('is-selected', o === el));
    }
    opts.forEach((o) => o.setAttribute('aria-checked', o.classList.contains('is-selected')));
    answers[q.id] = opts.filter((o) => o.classList.contains('is-selected')).map((o) => o.dataset.opt);
    updateNext(screen);
    Track.click(`${on ? '✖️' : '☑️'} ${NAMES[q.id]}: ${el.dataset.opt}`);
    Track.answer(q.id, answers[q.id]);
    if (q.id === 'days' && DAY_PRESETS[el.dataset.opt]) setDays(DAY_PRESETS[el.dataset.opt]);
  }

  app.addEventListener('click', (e) => {
    const t = e.target;
    const opt = t.closest('[data-opt]');
    if (opt) return toggle(opt);

    const day = t.closest('[data-day]');
    if (day) {
      dayTimers.forEach(clearTimeout);
      day.classList.toggle('is-selected');
      answers.weekdays = [...app.querySelectorAll('[data-day].is-selected')].map((d) => d.dataset.day);
      Track.click(`${day.classList.contains('is-selected') ? '☑️' : '✖️'} День: ${day.dataset.day}`);
      Track.answer('weekdays', answers.weekdays);
      return;
    }
    if (t.closest('[data-start]')) { Track.click('▶️ Take the Quiz'); return go(1); }
    if (t.closest('[data-back]')) { Track.click(`⬅️ Назад з кроку ${current}`); return go(current - 1); }
    const next = t.closest('[data-next]:not([disabled])');
    if (next) { Track.click(`➡️ ${next.textContent} (крок ${current})`); return go(current + 1); }
    if (t.closest('[data-finish]')) Track.cta(OFFER.cta);
  });

  app.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-opt], [data-day]')) {
      e.preventDefault();
      e.target.click();
    }
  });

  // preload images of upcoming screens
  window.addEventListener('load', () => {
    app.querySelectorAll('img').forEach((img) => { img.loading = 'eager'; });
  });

  // ?step=N opens a screen directly (handy for QA)
  const step = parseInt(new URLSearchParams(location.search).get('step'), 10);
  screens[0].classList.add('is-active');
  if (new URLSearchParams(location.search).has('demo')) {
    // reproduce the selection states shown in the Figma mockups
    Q.forEach((q) => {
      const s = app.querySelector(`[data-q="${q.id}"]`);
      const picks = q.id === 'zones' ? ['Hips', 'Legs'] : [s.querySelector('[data-opt]').dataset.opt];
      picks.forEach((p) => toggle(s.querySelector(`[data-opt="${p}"]`)));
    });
    ['Sun', 'Mon', 'Tue'].forEach((d) => app.querySelector(`[data-day="${d}"]`).click());
  }
  if (step > 0 && step < screens.length) go(step);
})();
</script>
